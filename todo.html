<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List | ApexPlanet</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/main.js" defer></script>
    <script src="js/todo.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="container navbar">
        <a href="index.html" class="brand">
          <span class="brand-mark">AP</span>
          <span>ApexPlanet</span>
        </a>
        <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">Menu</button>
        <nav class="nav-links" aria-label="Main navigation">
          <a href="index.html">Home</a>
          <a href="about.html">About</a>
          <a href="projects.html">Projects</a>
          <a href="contact.html">Contact</a>
          <a href="todo.html">To-Do</a>
          <a href="products.html">Product Listing</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="page-hero">
        <div class="container">
          <p class="eyebrow">Daily planner</p>
          <h1>My To-Do List</h1>
          <p>Track tasks, mark progress, and keep your workflow organized across refreshes.</p>
        </div>
      </section>

      <section class="section">
        <div class="container todo-layout">
          <div class="todo-column">
            <h2>Add a task</h2>
            <form id="todoForm" class="todo-form" novalidate>
              <input id="todoInput" type="text" placeholder="Enter a task" aria-label="Task name" />
              <button type="submit" class="btn btn-primary">Add Task</button>
            </form>
            <div id="todoMessage" class="form-message" aria-live="polite"></div>

            <div class="todo-meta">
              <span id="todoCounter">0 active tasks</span>
              <div class="todo-actions">
                <button type="button" id="clearCompleted" class="small-btn">Clear Completed</button>
                <button type="button" id="clearAll" class="small-btn">Clear All</button>
              </div>
            </div>
          </div>

          <div class="todo-column">
            <h2>Tasks</h2>
            <ul id="todoList" class="todo-list" aria-live="polite"></ul>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <div class="container footer-content">
        <p>© 2026 Aisha Patel</p>
        <p>To-Do App</p>
      </div>
    </footer>
  </body>
</html>
